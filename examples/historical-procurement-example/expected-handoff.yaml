schema_version: "0.5.4"
procurement_domain: property_material

source:
  source_files:
    - "示例历史采购数据.xlsx"
  source_quality: medium
  notes:
    - "本文件仅为结构示例。"

agreement_selection:
  agreement_field: "协议编号"
  available_agreements:
    - agreement_number: "HT-2025-001"
      raw_order_count: 90
      valid_order_count: 72
      valid_record_count: 100
      date_from: "2025-01-01"
      date_to: "2025-12-31"
      sku_count: 12
      valid_tax_included_amount: 500000
      regions:
        - "重庆市"
    - agreement_number: "HT-2025-002"
      raw_order_count: 30
      valid_order_count: 20
      valid_record_count: 35
      date_from: "2025-06-01"
      date_to: "2025-12-31"
      sku_count: 8
      valid_tax_included_amount: 180000
      regions:
        - "贵州省"
  selected_agreement_numbers:
    - "HT-2025-001"
  selection_confirmed: true
  include_unlinked_agreement_records: false
  unselected_order_count: 30
  unlinked_agreement_record_count: 0
  notes:
    - "采购员明确选择仅分析 HT-2025-001。"

order_status_filter:
  filter_status: applied
  status_field: "订单状态"
  allowed_statuses:
    - "已完成"
    - "执行中"
  total_rows: 120
  included_rows: 100
  excluded_rows: 20
  included_order_count: 72
  excluded_order_count: 18
  excluded_by_status:
    - status: "已取消"
      count: 12
    - status: "已退货"
      count: 8
  notes:
    - "只对选中的 HT-2025-001 执行正式统计。"

analysis_scope:
  project_name: "示例物资续采项目"
  regions:
    - "重庆市"
  baseline_period: "2025"
  target_period: "2026"
  period_completeness: full_year

historical_records:
  - agreement_number: "HT-2025-001"
    period: "2025"
    item_key: "SKU-A|品牌A|5L|桶|重庆市"
    item_name: "示例物资A"
    brand: "品牌A"
    specification: "5L"
    unit: "桶"
    region: "重庆市"
    supplier: null
    actual_quantity: 10000
    actual_amount: 500000
    average_unit_price: 50
    tax_basis: tax_included
    anomaly_flag: false
    anomaly_reason: null
    evidence:
      - "HT-2025-001 中已完成/执行中订单。"

scale_analysis:
  previous_period: "2025"
  target_period: "2026"
  previous_scale: 100
  target_scale: 108
  scale_unit: "项目数指数"
  yoy_growth_rate: 0.08
  growth_basis: user_confirmed_assumption
  evidence:
    - "采购员确认2026年度采购规模较2025年度增长8%。"

projection:
  method: quantity_driven
  scale_growth_rate_used: 0.08
  price_growth_rate_used: 0
  item_projections:
    - item_key: "SKU-A|品牌A|5L|桶|重庆市"
      region: "重庆市"
      baseline_quantity: 10000
      projected_quantity: 10800
      baseline_unit_price: 50
      projected_unit_price: 50
      projected_amount: 540000
      projection_method: last_full_year_adjusted_by_scale
      confidence: medium
      evidence:
        - "所选协议2025年有效订单实际采购量10000桶。"
        - "2026采购规模增长率8%。"
  projected_total_amount: 540000

requirement_handoff:
  selected_agreement_numbers:
    - "HT-2025-001"
  quantity_updates:
    - item_key: "SKU-A|品牌A|5L|桶|重庆市"
      region: "重庆市"
      baseline_quantity: 10000
      baseline_period: "2025"
      growth_rate_applied: 0.08
      suggested_estimated_quantity: 10800
      suggested_estimated_amount: 540000
      confidence: medium
      evidence:
        - "仅统计 HT-2025-001 中已完成/执行中订单。"
      human_confirmation_status: pending
  requirement_workbook_output:
    template_path: ".agents/skills/historical-procurement-analysis/templates/需求清单模板.xlsx"
    output_filename: "示例物资续采项目-历史测算需求清单.xlsx"
    output_status: generated
    populated_fields:
      - "序号"
      - "区域"
      - "名称"
      - "品牌"
      - "规格"
      - "单位"
      - "年度预计采购量"
    supplier_response_fields_left_blank:
      - "含税单价"
      - "未税单价"
      - "税率"
      - "含税总价"
    notes:
      - "历史参考单价仅用于内部金额测算，不写入供方报价列。"

strategy_report_handoff:
  selected_agreement_numbers:
    - "HT-2025-001"
  agreement_scope_summary:
    - "本次仅分析协议 HT-2025-001，HT-2025-002 未纳入。"
  order_filter_summary:
    - "选中协议中仅保留已完成/执行中订单。"
  spend_analysis:
    - "2025年有效含税采购额500000元。"
  price_analysis:
    - "历史有效订单平均含税单价50元/桶。"
  demand_projection_basis:
    - "2026采购规模同比预计增长8%。"
  key_findings:
    - "示例SKU预计采购量10800桶。"
  risk_flags:
    - "预测结果仍需采购员最终确认。"
  report_ready_facts:
    - fact: "HT-2025-001 中2025年度示例SKU有效订单实际采购量为10000桶。"
      evidence:
        - "示例历史采购数据.xlsx"

human_review:
  agreement_selection_confirmed: true
  order_filter_reviewed: false
  projection_reviewed: false
  quantity_updates_confirmed: false
  reviewer_notes: []
