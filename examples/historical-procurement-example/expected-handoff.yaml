  coverage_end: "2025-06-30"
  covered_days: 181
  covered_months: 6
  covered_month_equivalent: 5.95
  annualization_required: true
  annualization_method: full_calendar_months_to_12
  annualization_factor: 2
  seasonality_risk: medium
  notes:
    - "6个月有效采购量按12/6比例折算为12个月基线。"

growth_rate_decision:
  status: pending_user_confirmation
  two_year_comparable_data_available: false
  earlier_period: null
  later_period: null
  earlier_spend: null
  later_spend: null
  calculated_growth_rate: null
  confirmed_growth_rate: null
  growth_rate_source: unavailable
  price_effect_warning: null
  user_options:
    - supplement_comparable_history
    - provide_estimated_growth_rate
    - use_zero_growth
  notes:
    - "当前只有一个部分年度，需用户补充数据或确认增量比例。"

historical_records:
  - agreement_number: "HT-2025-001"
    period: "2025H1"
    item_key: "SKU-A|品牌A|5L|桶|重庆市"
    item_name: "示例物资A"
    brand: "品牌A"
    specification: "5L"
    unit: "桶"
    region: "重庆市"
    supplier: null
    actual_quantity: 5000
    actual_amount: 250000
    average_unit_price: 50
    tax_basis: tax_included
    anomaly_flag: false
    anomaly_reason: null
    evidence:
      - "HT-2025-001中2025年1-6月已完成/执行中订单。"

projection:
  method: quantity_driven
  growth_rate_used: null
  price_growth_rate_used: 0
  item_projections:
    - item_key: "SKU-A|品牌A|5L|桶|重庆市"
      region: "重庆市"
      observed_quantity: 5000
      observed_amount: 250000
      covered_month_equivalent: 6
      annualization_factor: 2
