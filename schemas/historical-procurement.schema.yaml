$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/historical-procurement.schema.yaml"
title: "物业物资历史采购分析"
description: >-
  历史订单分析前必须先由用户明确选择一个或多个协议编号，再仅保留已完成和执行中订单，
  形成可追溯的采购数量/金额基线、需求清单输出及采购策略 Handoff。
type: object
additionalProperties: false
required:
  - schema_version
  - procurement_domain
  - source
  - agreement_selection
  - order_status_filter
  - analysis_scope
  - historical_records
  - projection
  - requirement_handoff
  - strategy_report_handoff
properties:
  schema_version:
    type: string
    const: "0.5.4"
  procurement_domain:
    type: string
    const: property_material

  source:
    type: object
    additionalProperties: false
    required: [source_files]
    properties:
      source_files:
        type: array
        minItems: 1
        items: {type: string}
      source_quality:
        type: string
        enum: [high, medium, low, unknown]
      notes:
        type: array
        items: {type: string}

  agreement_selection:
    type: object
    additionalProperties: false
    required:
      - agreement_field
      - available_agreements
      - selected_agreement_numbers
      - selection_confirmed
    properties:
      agreement_field:
        type: string
      available_agreements:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [agreement_number]
          properties:
            agreement_number: {type: string}
            raw_order_count: {type: [integer, "null"], minimum: 0}
            valid_order_count: {type: [integer, "null"], minimum: 0}
            valid_record_count: {type: [integer, "null"], minimum: 0}
            date_from: {type: [string, "null"]}
            date_to: {type: [string, "null"]}
            sku_count: {type: [integer, "null"], minimum: 0}
            valid_tax_included_amount: {type: [number, "null"], minimum: 0}
            regions:
              type: array
              items: {type: string}
      selected_agreement_numbers:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      selection_confirmed:
        type: boolean
        const: true
      include_unlinked_agreement_records:
        type: boolean
        default: false
      unselected_order_count:
        type: [integer, "null"]
        minimum: 0
      unlinked_agreement_record_count:
        type: [integer, "null"]
        minimum: 0
      notes:
        type: array
        items: {type: string}

  order_status_filter:
    type: object
    additionalProperties: false
    required:
      - filter_status
      - allowed_statuses
      - status_field
      - notes
    properties:
      filter_status:
        type: string
        enum: [applied, missing_status_field, user_confirmed_prefiltered]
      status_field:
        type: [string, "null"]
      allowed_statuses:
        const: ["已完成", "执行中"]
      total_rows: {type: [integer, "null"], minimum: 0}
      included_rows: {type: [integer, "null"], minimum: 0}
      excluded_rows: {type: [integer, "null"], minimum: 0}
      included_order_count: {type: [integer, "null"], minimum: 0}
      excluded_order_count: {type: [integer, "null"], minimum: 0}
      excluded_by_status:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [status, count]
          properties:
            status: {type: string}
            count: {type: integer, minimum: 0}
      notes:
        type: array
        items: {type: string}

  analysis_scope:
    type: object
    additionalProperties: false
    properties:
      project_name: {type: [string, "null"]}
      regions:
        type: array
        items: {type: string}
      baseline_period: {type: [string, "null"]}
      target_period: {type: [string, "null"]}
      period_completeness:
        type: string
        enum: [full_year, comparable_period, partial_period, unknown]

  historical_records:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [agreement_number, period, item_key, item_name, unit]
      properties:
        agreement_number: {type: string}
        period: {type: string}
        item_key: {type: string}
        item_name: {type: string}
        brand: {type: [string, "null"]}
        specification: {type: [string, "null"]}
        unit: {type: string}
        region: {type: [string, "null"]}
        supplier: {type: [string, "null"]}
        actual_quantity: {type: [number, "null"], minimum: 0}
        actual_amount: {type: [number, "null"], minimum: 0}
        average_unit_price: {type: [number, "null"], minimum: 0}
        tax_basis:
          type: [string, "null"]
          enum: [tax_included, pre_tax, mixed, unknown, null]
        anomaly_flag: {type: boolean}
        anomaly_reason: {type: [string, "null"]}
        evidence:
          type: array
          items: {type: string}

  scale_analysis:
    type: object
    additionalProperties: false
    properties:
      previous_period: {type: [string, "null"]}
      target_period: {type: [string, "null"]}
      previous_scale: {type: [number, "null"]}
      target_scale: {type: [number, "null"]}
      scale_unit: {type: [string, "null"]}
      yoy_growth_rate: {type: [number, "null"]}
      growth_basis:
        type: string
        enum: [official_business_plan, official_scale_data, user_confirmed_assumption, historical_trend_only, unavailable]
      evidence:
        type: array
        items: {type: string}

  projection:
    type: object
    additionalProperties: false
    required: [method, item_projections]
    properties:
      method:
        type: string
        enum: [quantity_driven, amount_only, no_projection]
      scale_growth_rate_used: {type: [number, "null"]}
      price_growth_rate_used: {type: [number, "null"]}
      item_projections:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [item_key, projection_method, confidence]
          properties:
            item_key: {type: string}
            region: {type: [string, "null"]}
            baseline_quantity: {type: [number, "null"], minimum: 0}
            projected_quantity: {type: [number, "null"], minimum: 0}
            baseline_unit_price: {type: [number, "null"], minimum: 0}
            projected_unit_price: {type: [number, "null"], minimum: 0}
            projected_amount: {type: [number, "null"], minimum: 0}
            projection_method:
              type: string
              enum:
                - last_full_year_actual
                - multi_year_average
                - last_full_year_adjusted_by_scale
                - amount_only_adjusted_by_scale
                - user_confirmed_override
                - no_reliable_projection
            confidence:
              type: string
              enum: [high, medium, low]
            evidence:
              type: array
              items: {type: string}
      projected_total_amount: {type: [number, "null"]}

  requirement_handoff:
    type: object
    additionalProperties: false
    required:
      - selected_agreement_numbers
      - quantity_updates
      - requirement_workbook_output
    properties:
      selected_agreement_numbers:
        type: array
        minItems: 1
        items: {type: string}
      quantity_updates:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [item_key, evidence, human_confirmation_status]
          properties:
            item_key: {type: string}
            region: {type: [string, "null"]}
            baseline_quantity: {type: [number, "null"]}
            baseline_period: {type: [string, "null"]}
            growth_rate_applied: {type: [number, "null"]}
            suggested_estimated_quantity: {type: [number, "null"], minimum: 0}
            suggested_estimated_amount: {type: [number, "null"], minimum: 0}
            confidence:
              type: string
              enum: [high, medium, low]
            evidence:
              type: array
              minItems: 1
              items: {type: string}
            human_confirmation_status:
              type: string
              enum: [pending, confirmed, adjusted]
      requirement_workbook_output:
        type: object
        additionalProperties: false
        required:
          - template_path
          - output_filename
          - output_status
          - supplier_response_fields_left_blank
        properties:
          template_path: {type: string}
          output_filename: {type: string}
          output_status:
            type: string
            enum: [generated, generated_with_pending_quantities, blocked]
          populated_fields:
            type: array
            items: {type: string}
          supplier_response_fields_left_blank:
            const: ["含税单价", "未税单价", "税率", "含税总价"]
          notes:
            type: array
            items: {type: string}

  strategy_report_handoff:
    type: object
    additionalProperties: false
    properties:
      selected_agreement_numbers:
        type: array
        items: {type: string}
      agreement_scope_summary:
        type: array
        items: {type: string}
      order_filter_summary:
        type: array
        items: {type: string}
      spend_analysis:
        type: array
        items: {type: string}
      price_analysis:
        type: array
        items: {type: string}
      demand_projection_basis:
        type: array
        items: {type: string}
      key_findings:
        type: array
        items: {type: string}
      risk_flags:
        type: array
        items: {type: string}
      report_ready_facts:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [fact, evidence]
          properties:
            fact: {type: string}
            evidence:
              type: array
              minItems: 1
              items: {type: string}

  human_review:
    type: object
    additionalProperties: false
    properties:
      agreement_selection_confirmed: {type: boolean}
      order_filter_reviewed: {type: boolean}
      projection_reviewed: {type: boolean}
      quantity_updates_confirmed: {type: boolean}
      reviewer_notes:
        type: array
        items: {type: string}
