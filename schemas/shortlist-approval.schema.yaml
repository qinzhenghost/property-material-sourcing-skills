$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/shortlist-approval.schema.yaml"
title: "物业物资供方短名单报批结果"
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - shortlist_summary
  - approval_email
  - human_review
properties:
  schema_version:
    type: string
    const: "0.6.0"

  project:
    type: object
    additionalProperties: false
    required: [project_name]
    properties:
      project_name:
        type: string
      category:
        type: [string, "null"]
      sourcing_method:
        type: string
        const: "invitation_tender"

  shortlist_summary:
    type: object
    additionalProperties: false
    properties:
      longlist_count:
        type: [integer, "null"]
        minimum: 0
      contacted_count:
        type: [integer, "null"]
        minimum: 0
      replied_count:
        type: [integer, "null"]
        minimum: 0
      shortlisted_count:
        type: [integer, "null"]
        minimum: 0
      excluded_count:
        type: [integer, "null"]
        minimum: 0
      pending_count:
        type: [integer, "null"]
        minimum: 0
      shortlisted_suppliers:
        type: array
        items:
          $ref: "#/$defs/supplier_decision"
      excluded_suppliers:
        type: array
        items:
          $ref: "#/$defs/supplier_decision"
      pending_suppliers:
        type: array
        items:
          $ref: "#/$defs/supplier_decision"

  approval_email:
    type: object
    additionalProperties: false
    required: [status, subject, body]
    properties:
      status:
        type: string
        enum: [draft_pending_human_review, ready_after_human_review]
      subject:
        type: string
      body:
        type: string
      attachments:
        type: array
        items:
          type: string

  strategy_handoff:
    type: object
    additionalProperties: false
    properties:
      selection_rationale:
        type: array
        items:
          type: string
      supplier_market_observations:
        type: array
        items:
          type: string
      risk_flags:
        type: array
        items:
          type: string
      shortlisted_supplier_names:
        type: array
        items:
          type: string

  human_review:
    type: object
    additionalProperties: false
    required: [shortlist_confirmed, email_confirmed]
    properties:
      shortlist_confirmed:
        type: boolean
      email_confirmed:
        type: boolean
      reviewer_note:
        type: [string, "null"]

$defs:
  supplier_decision:
    type: object
    additionalProperties: false
    required: [supplier_name, status, reasons]
    properties:
      supplier_name:
        type: string
      status:
        type: string
        enum: [shortlisted, excluded, pending_clarification]
      reasons:
        type: array
        items:
          type: string
      attention_items:
        type: array
        items:
          type: string
      evidence_source:
        type: array
        items:
          type: string
