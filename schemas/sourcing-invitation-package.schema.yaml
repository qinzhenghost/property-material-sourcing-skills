$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/property-material-sourcing-invitation-package.schema.yaml"
title: "物业物资邀标沟通三件套"
description: >-
  official-supplier-matching 经人工确认后，由 sourcing-invitation 生成的标准输出包。
  固定包含一个 BCC 群发 EML 草稿和两个独立 Excel 文件；EML 不嵌入附件且不得自动发送。
  招标意向征集登记表必须基于企业原始模板副本生成并保持模板完整性；Sheet1!N3 的投标保证金
  按采购清单预估总金额的 1% 计算并向上取整至 1000 元整数倍。
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - recipients
  - bid_bond
  - artifacts
  - consistency_check
properties:
  schema_version:
    type: string
    const: "0.3.3"

  project:
    type: object
    additionalProperties: false
    required: [project_name, procurement_domain, delivery_regions]
    properties:
      project_name: {type: string}
      procurement_domain: {type: string, const: property_material}
      delivery_regions:
        type: array
        minItems: 1
        items: {type: string}
      cooperation_period: {type: [string, "null"]}
      payment_terms: {type: [string, "null"]}
      quotation_basis: {type: [string, "null"]}
      contact_name: {type: [string, "null"]}
      contact_phone: {type: [string, "null"]}
      contact_email: {type: [string, "null"]}
      response_deadline: {type: [string, "null"]}
      procurement_estimated_total_amount:
        type: [number, "null"]
        minimum: 0
        description: "当前项目可追溯的采购清单预估总金额；不得使用供应商未填写的报价列推断。"
      procurement_estimated_total_amount_source:
        type: [string, "null"]
        enum:
          - confirmed_requirement
          - historical_procurement_handoff
          - material_requirement_handoff
          - human_confirmed
          - null

  recipients:
    type: object
    additionalProperties: false
    required: [selected_supplier_count, bcc_recipients, missing_recipient_emails]
    properties:
      selected_supplier_count: {type: integer, minimum: 1}
      bcc_recipients:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, email, source]
          properties:
            supplier_id: {type: [string, "null"]}
            supplier_name: {type: string}
            contact_name: {type: [string, "null"]}
            email: {type: string}
            source: {type: string, enum: [official_registry, human_confirmed]}
      missing_recipient_emails:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, reason]
          properties:
            supplier_id: {type: [string, "null"]}
            supplier_name: {type: string}
            reason: {type: string, enum: [missing_email, email_source_unconfirmed, conflicting_email]}
      to:
        type: [string, "null"]
        description: "不得填供方邮箱；仅可使用采购方明确提供的本方发送/归档地址。"
      cc:
        type: array
        items: {type: string}
      from: {type: [string, "null"]}

  bid_bond:
    type: object
    additionalProperties: false
    required:
      - rate
      - rounding_unit
      - rounding_mode
      - template_cell
      - template_variable
      - status
    properties:
      rate:
        type: number
        const: 0.01
      rounding_unit:
        type: integer
        const: 1000
      rounding_mode:
        type: string
        const: ceiling
      formula:
        type: string
        const: "CEILING(procurement_estimated_total_amount * 0.01, 1000)"
      raw_amount:
        type: [number, "null"]
        minimum: 0
      calculated_amount:
        type: [integer, "null"]
        minimum: 0
        multipleOf: 1000
      amount_source:
        type: [string, "null"]
      template_cell:
        type: string
        const: "Sheet1!N3"
      template_variable:
        type: string
        const: "{{投标保证金金额}}"
      status:
        type: string
        enum:
          - calculated
          - missing_procurement_estimated_total_amount
          - blocked

  artifacts:
    type: object
    additionalProperties: false
    required: [invitation_email, requirement_list, supplier_intention_form]
    properties:
      invitation_email:
        type: object
        additionalProperties: false
        required: [format, filename, recipient_mode, attachments_embedded, status]
        properties:
          format: {type: string, const: eml}
          filename: {type: string}
          recipient_mode: {type: string, const: single_email_bcc}
          subject: {type: [string, "null"]}
          bcc_count: {type: integer, minimum: 0}
          attachments_embedded: {type: boolean, const: false}
          referenced_attachment_filenames:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string}
          template: {type: [string, "null"]}
          status:
            type: string
            enum: [ready_for_human_review, draft_missing_recipient_email, draft_recipient_email_conflict, blocked]

      requirement_list:
        type: object
        additionalProperties: false
        required: [format, filename, source, status]
        properties:
          format: {type: string, const: xlsx}
          filename: {type: string}
          source: {type: string, const: confirmed_requirement}
          embedded_in_eml: {type: boolean, const: false}
          status: {type: string, enum: [generated, blocked]}

      supplier_intention_form:
        type: object
        additionalProperties: false
        required:
          - format
          - filename
          - template
          - template_source_mode
          - template_integrity_preserved
          - bid_bond_cell
          - bid_bond_variable_replaced
          - status
        properties:
          format: {type: string, const: xlsx}
          filename: {type: string}
          template: {type: string}
          template_source_mode: {type: string, const: copy_original_enterprise_template}
          template_integrity_preserved: {type: boolean, const: true}
          embedded_in_eml: {type: boolean, const: false}
          populated_project_fields:
            type: array
            items: {type: string}
          supplier_response_fields_left_blank:
            type: boolean
            const: true
          bid_bond_cell:
            type: string
            const: "Sheet1!N3"
          bid_bond_variable_replaced:
            type: boolean
          bid_bond_amount_written:
            type: [integer, "null"]
            minimum: 0
            multipleOf: 1000
          status:
            type: string
            enum: [generated, blocked_missing_estimated_total_amount, blocked_template_integrity, blocked_bid_bond_mismatch]

  consistency_check:
    type: object
    additionalProperties: false
    required: [passed, checked_fields]
    properties:
      passed: {type: boolean}
      checked_fields:
        type: array
        items: {type: string}
      supplier_emails_only_in_bcc: {type: boolean}
      eml_has_no_embedded_attachments: {type: boolean}
      attachment_filenames_match_body: {type: boolean}
      original_intention_form_template_preserved: {type: boolean}
      procurement_estimated_total_amount_traceable: {type: boolean}
      bid_bond_formula_correct: {type: boolean}
      bid_bond_n3_variable_replaced: {type: boolean}
      bid_bond_n3_amount_matches_calculation: {type: boolean}
      issues:
        type: array
        items: {type: string}

  human_checkpoint:
    type: object
    additionalProperties: false
    properties:
      status: {type: string, enum: [pending_send_review, approved_to_send]}
      actual_attachments_added_before_send: {type: [boolean, "null"]}
      bid_bond_amount_reviewed: {type: [boolean, "null"]}
      notes:
        type: array
        items: {type: string}
