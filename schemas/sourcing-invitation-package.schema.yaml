$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/property-material-sourcing-invitation-package.schema.yaml"
title: "物业物资邀标沟通三件套"
description: >-
  official-supplier-matching 经人工确认后，由 sourcing-invitation 生成的标准输出包。
  固定包含一个 BCC 群发 EML 草稿和两个独立 Excel 文件；EML 不嵌入附件且不得自动发送。
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - recipients
  - artifacts
  - consistency_check
properties:
  schema_version:
    type: string
    const: "0.3.1"

  project:
    type: object
    additionalProperties: false
    required: [project_name, procurement_domain, delivery_regions]
    properties:
      project_name: {type: string}
      procurement_domain: {type: string, const: property_material}
      delivery_regions:
        type: array
        minItems: 1
        items: {type: string}
      cooperation_period: {type: [string, "null"]}
      payment_terms: {type: [string, "null"]}
      quotation_basis: {type: [string, "null"]}
      contact_name: {type: [string, "null"]}
      contact_phone: {type: [string, "null"]}
      contact_email: {type: [string, "null"]}
      response_deadline: {type: [string, "null"]}

  recipients:
    type: object
    additionalProperties: false
    required:
      - selected_supplier_count
      - bcc_recipients
      - missing_recipient_emails
    properties:
      selected_supplier_count:
        type: integer
        minimum: 1
      bcc_recipients:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, email, source]
          properties:
            supplier_id: {type: [string, "null"]}
            supplier_name: {type: string}
            contact_name: {type: [string, "null"]}
            email: {type: string}
            source:
              type: string
              enum: [official_registry, human_confirmed]
      missing_recipient_emails:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, reason]
          properties:
            supplier_id: {type: [string, "null"]}
            supplier_name: {type: string}
            reason:
              type: string
              enum: [missing_email, email_source_unconfirmed, conflicting_email]
      to:
        type: [string, "null"]
        description: "不得填供方邮箱；仅可使用采购方明确提供的本方发送/归档地址。"
      cc:
        type: array
        items: {type: string}
        description: "仅限采购员明确确认的内部抄送邮箱。"
      from:
        type: [string, "null"]

  artifacts:
    type: object
    additionalProperties: false
    required: [invitation_email, requirement_list, supplier_intention_form]
    properties:
      invitation_email:
        type: object
        additionalProperties: false
        required:
          - format
          - filename
          - recipient_mode
          - attachments_embedded
          - status
        properties:
          format: {type: string, const: eml}
          filename: {type: string}
          recipient_mode: {type: string, const: single_email_bcc}
          subject: {type: [string, "null"]}
          bcc_count: {type: integer, minimum: 0}
          attachments_embedded: {type: boolean, const: false}
          referenced_attachment_filenames:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string}
          template: {type: [string, "null"]}
          status:
            type: string
            enum:
              - ready_for_human_review
              - draft_missing_recipient_email
              - draft_recipient_email_conflict
              - blocked

      requirement_list:
        type: object
        additionalProperties: false
        required: [format, filename, source, status]
        properties:
          format: {type: string, const: xlsx}
          filename: {type: string}
          source: {type: string, const: confirmed_requirement}
          embedded_in_eml: {type: boolean, const: false}
          status: {type: string, enum: [generated, blocked]}

      supplier_intention_form:
        type: object
        additionalProperties: false
        required: [format, filename, template, status]
        properties:
          format: {type: string, const: xlsx}
          filename: {type: string}
          template: {type: string}
          embedded_in_eml: {type: boolean, const: false}
          status: {type: string, enum: [generated, blocked]}

  consistency_check:
    type: object
    additionalProperties: false
    required: [passed, checked_fields]
    properties:
      passed: {type: boolean}
      checked_fields:
        type: array
        items: {type: string}
      supplier_emails_only_in_bcc: {type: boolean}
      eml_has_no_embedded_attachments: {type: boolean}
      attachment_filenames_match_body: {type: boolean}
      issues:
        type: array
        items: {type: string}

  human_checkpoint:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum: [pending_send_review, approved_to_send]
      actual_attachments_added_before_send: {type: [boolean, "null"]}
      notes:
        type: array
        items: {type: string}
