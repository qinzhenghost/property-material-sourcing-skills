$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/sourcing-strategy.schema.yaml"
title: "物业物资采购方案报告数据"
type: object
additionalProperties: false
required:
  - schema_version
  - report_status
  - project
  - demand_background
  - scope_and_lots
  - spend_analysis
  - market_analysis
  - shortlist
  - commercial_terms
  - supplier_selection
  - target_price
  - award_rule
  - share_allocation
  - risks
  - evaluation_team
  - consistency_checks
  - content_depth_checks
  - report_content_metrics
properties:
  schema_version:
    type: string
    const: "0.7.4"

  report_status:
    type: string
    enum: [draft, ready_for_approval]

  project:
    type: object
    additionalProperties: false
    required: [project_name, procurement_method]
    properties:
      project_name: {type: string}
      procurement_method:
        type: string
        enum: [invitation_tender, competitive_negotiation, single_source, other]
      demand_time: {type: [string, "null"]}
      procurement_period: {type: [string, "null"]}
      budget_amount: {type: [number, "null"], minimum: 0}
      budget_tax_basis:
        type: [string, "null"]
        enum: [tax_included, pre_tax, mixed, unknown, null]
      budget_source: {$ref: "#/$defs/evidence_value"}

  demand_background:
    type: object
    additionalProperties: false
    properties:
      summary: {type: [string, "null"]}
      usage_scenarios:
        type: array
        items: {type: string}
      delivery_regions:
        type: array
        items: {type: string}
      delivery_requirements:
        type: array
        items: {type: string}
      original_contract_expiry: {type: [string, "null"]}
      historical_findings:
        type: array
        items: {type: string}
      demand_growth_basis: {type: [string, "null"]}
      procurement_objective:
        type: array
        items: {type: string}

  scope_and_lots:
    type: object
    additionalProperties: false
    properties:
      sku_count: {type: [integer, "null"], minimum: 0}
      estimated_total_quantity: {type: [number, "null"], minimum: 0}
      lot_count: {type: [integer, "null"], minimum: 1}
      lot_description:
        type: array
        items: {type: string}
      scope_findings:
        type: array
        items: {type: string}
      quantity_source: {$ref: "#/$defs/evidence_value"}

  spend_analysis:
    type: object
    additionalProperties: false
    required:
      - completeness_status
      - analysis_basis
      - dimension_coverage
      - overall_findings
      - free_shipping_analysis
      - key_findings
      - sourcing_implications
      - data_limitations
    properties:
      completeness_status:
        type: string
        enum: [complete, partial, insufficient_data]
      analysis_basis:
        type: array
        minItems: 1
        items: {type: string}
      historical_period: {type: [string, "null"]}
      historical_tax_included_spend: {type: [number, "null"], minimum: 0}
      historical_pre_tax_spend: {type: [number, "null"], minimum: 0}
      projected_spend: {type: [number, "null"], minimum: 0}
      order_count: {type: [integer, "null"], minimum: 0}
      valid_line_count: {type: [integer, "null"], minimum: 0}
      average_order_value: {type: [number, "null"], minimum: 0}
      average_period_spend: {type: [number, "null"], minimum: 0}
      yoy_change_rate: {type: [number, "null"]}
      overall_findings:
        type: array
        minItems: 1
        items: {type: string}
      dimension_coverage:
        type: object
        additionalProperties: false
        required: [region, business_unit, order_amount, sku, supplier, price]
        properties:
          region: {$ref: "#/$defs/dimension_status"}
          business_unit: {$ref: "#/$defs/dimension_status"}
          order_amount: {$ref: "#/$defs/dimension_status"}
          sku: {$ref: "#/$defs/dimension_status"}
          supplier: {$ref: "#/$defs/dimension_status"}
          price: {$ref: "#/$defs/dimension_status"}
      region_findings:
        type: array
        items: {type: string}
      region_breakdown:
        type: array
        items: {$ref: "#/$defs/spend_dimension_item"}
      business_unit_findings:
        type: array
        items: {type: string}
      business_unit_breakdown:
        type: array
        items: {$ref: "#/$defs/spend_dimension_item"}
      order_amount_findings:
        type: array
        items: {type: string}
      order_amount_distribution:
        type: array
        items: {$ref: "#/$defs/order_amount_bucket"}
      sku_findings:
        type: array
        items: {type: string}
      sku_breakdown:
        type: array
        items: {$ref: "#/$defs/sku_spend_item"}
      pareto_80_sku_count: {type: [integer, "null"], minimum: 0}
      top5_spend_share: {type: [number, "null"], minimum: 0, maximum: 1}
      top10_spend_share: {type: [number, "null"], minimum: 0, maximum: 1}
      supplier_findings:
        type: array
        items: {type: string}
      supplier_breakdown:
        type: array
        items: {$ref: "#/$defs/spend_dimension_item"}
      concentration_findings:
        type: array
        items: {type: string}
      price_findings:
        type: array
        items: {type: string}
      free_shipping_analysis:
        type: object
        additionalProperties: false
        required: [analysis, decision_status]
        properties:
          historical_rule: {type: [string, "null"]}
          supplier_feedback:
            type: array
            items: {type: string}
          analysis:
            type: array
            minItems: 1
            items: {type: string}
          suggested_options:
            type: array
            items: {type: string}
          decision_status:
            type: string
            enum: [not_applicable, pending_human_confirmation, human_confirmed]
          confirmed_rule: {type: [string, "null"]}
      key_findings:
        type: array
        minItems: 1
        items: {type: string}
      sourcing_implications:
        type: array
        minItems: 1
        items: {type: string}
      data_limitations:
        type: array
        items: {type: string}
    allOf:
      - if:
          properties:
            completeness_status: {const: complete}
        then:
          properties:
            key_findings: {minItems: 3}
            sourcing_implications: {minItems: 3}

  market_analysis:
    type: object
    additionalProperties: false
    required:
      - completeness_status
      - internal_supply_signals
      - supply_landscape
      - market_characteristics
      - cost_drivers
      - cost_structure
      - local_fulfillment_factors
      - price_trends
      - market_risks
      - sourcing_implications
      - sources
    properties:
      completeness_status:
        type: string
        enum: [complete, partial, public_research_incomplete]
      target_regions:
        type: array
        items: {type: string}
      category: {type: [string, "null"]}
      research_date: {type: [string, "null"]}
      internal_supply_signals:
        type: array
        items: {type: string}
      supply_landscape:
        type: array
        items: {type: string}
      market_characteristics:
        type: array
        items: {type: string}
      cost_drivers:
        type: array
        items: {type: string}
      cost_structure:
        type: array
        items: {$ref: "#/$defs/cost_component"}
      local_fulfillment_factors:
        type: array
        items: {type: string}
      price_trends:
        type: array
        items: {type: string}
      regulatory_factors:
        type: array
        items: {type: string}
      market_risks:
        type: array
        items: {type: string}
      sourcing_implications:
        type: array
        items: {type: string}
      sources:
        type: array
        items: {$ref: "#/$defs/public_source"}
    allOf:
      - if:
          properties:
            completeness_status: {const: complete}
        then:
          properties:
            internal_supply_signals: {minItems: 3}
            cost_drivers: {minItems: 4}
            cost_structure: {minItems: 4}
            local_fulfillment_factors: {minItems: 2}
            price_trends: {minItems: 1}
            market_risks: {minItems: 1}
            sourcing_implications: {minItems: 3}

  shortlist:
    type: object
    additionalProperties: false
    properties:
      official_registry_candidates: {type: [integer, "null"], minimum: 0}
      region_covered_candidates: {type: [integer, "null"], minimum: 0}
      contacted_suppliers: {type: [integer, "null"], minimum: 0}
      replied_suppliers: {type: [integer, "null"], minimum: 0}
      shortlisted_count: {type: [integer, "null"], minimum: 0}
      funnel_summary:
        type: array
        items: {type: string}
      shortlisted_suppliers:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, reasons]
          properties:
            supplier_name: {type: string}
            reasons:
              type: array
              minItems: 1
              items: {type: string}
            attention_items:
              type: array
              items: {type: string}
      evidence: {$ref: "#/$defs/evidence_value"}

  commercial_terms:
    type: object
    additionalProperties: false
    properties:
      delivery_lead_time: {type: [string, "null"]}
      warranty: {type: [string, "null"]}
      payment_terms: {type: [string, "null"]}
      contract_period: {type: [string, "null"]}
      tax_terms: {type: [string, "null"]}
      bid_bond: {type: [string, "null"]}
      performance_bond: {type: [string, "null"]}
      minimum_delivery_or_free_shipping_rule: {type: [string, "null"]}
      price_management_rule: {type: [string, "null"]}

  supplier_selection:
    type: object
    additionalProperties: false
    properties:
      method: {type: [string, "null"]}
      technical_bid_required: {type: [boolean, "null"]}
      commercial_weight: {type: [number, "null"], minimum: 0, maximum: 1}
      description: {type: [string, "null"]}
      schedule:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [activity]
          properties:
            activity: {type: string}
            responsible_role: {type: [string, "null"]}
            target_date: {type: [string, "null"]}
      human_confirmed: {type: boolean}

  target_price:
    type: object
    additionalProperties: false
    properties:
      basis:
        type: array
        items: {type: string}
      basic_target: {type: [string, "null"]}
      challenge_target: {type: [string, "null"]}
      human_confirmed: {type: boolean}

  award_rule:
    type: object
    additionalProperties: false
    properties:
      award_supplier_count: {type: [integer, "null"], minimum: 1}
      backup_supplier_count: {type: [integer, "null"], minimum: 0}
      ranking_basis: {type: [string, "null"]}
      tie_rule: {type: [string, "null"]}
      negotiation_rule: {type: [string, "null"]}
      backup_activation_rule: {type: [string, "null"]}
      insufficient_bid_rule: {type: [string, "null"]}
      over_budget_rule: {type: [string, "null"]}
      human_confirmed: {type: boolean}

  share_allocation:
    type: object
    additionalProperties: false
    properties:
      applicable: {type: boolean}
      description: {type: [string, "null"]}
      human_confirmed: {type: boolean}

  risks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [risk, evidence, impact, mitigation]
      properties:
        risk: {type: string}
        trigger: {type: [string, "null"]}
        evidence: {type: string}
        impact: {type: string}
        mitigation: {type: string}
        human_confirmation_required: {type: boolean}

  evaluation_team:
    type: object
    additionalProperties: false
    properties:
      members:
        type: array
        items: {type: string}
      status:
        type: string
        enum: [confirmed, pending]
      source: {$ref: "#/$defs/evidence_value"}

  consistency_checks:
    type: object
    additionalProperties: false
    required:
      - quantity_consistent
      - budget_consistent
      - region_consistent
      - shortlist_consistent
      - commercial_terms_consistent
      - award_rule_consistent
      - spend_totals_consistent
      - public_market_did_not_change_shortlist
    properties:
      quantity_consistent: {type: boolean}
      budget_consistent: {type: boolean}
      region_consistent: {type: boolean}
      shortlist_consistent: {type: boolean}
      commercial_terms_consistent: {type: boolean}
      award_rule_consistent: {type: boolean}
      spend_totals_consistent: {type: boolean}
      public_market_did_not_change_shortlist: {type: boolean}
      blockers:
        type: array
        items: {type: string}

  content_depth_checks:
    type: object
    additionalProperties: false
    required:
      - spend_has_numeric_structure
      - spend_available_dimensions_analyzed
      - spend_has_procurement_implications
      - spend_template_overall_filled
      - spend_template_business_unit_handled
      - spend_template_sku_filled
      - spend_template_free_shipping_handled
      - market_has_internal_supply_signals
      - market_has_cost_drivers
      - market_has_price_or_risk_view
      - market_has_local_fulfillment_view
      - market_has_procurement_implications
      - market_template_market_situation_filled
      - market_template_cost_structure_filled
      - unsourced_cost_percentages_absent
      - docx_expanded_instead_of_truncated
      - template_placeholders_removed
    properties:
      spend_has_numeric_structure: {type: boolean}
      spend_available_dimensions_analyzed: {type: boolean}
      spend_has_procurement_implications: {type: boolean}
      spend_template_overall_filled: {type: boolean}
      spend_template_business_unit_handled: {type: boolean}
      spend_template_sku_filled: {type: boolean}
      spend_template_free_shipping_handled: {type: boolean}
      free_shipping_supported_by_order_or_fulfillment_evidence: {type: boolean}
      market_has_internal_supply_signals: {type: boolean}
      market_public_research_performed_when_web_available: {type: boolean}
      market_has_cost_drivers: {type: boolean}
      market_has_price_or_risk_view: {type: boolean}
      market_has_local_fulfillment_view: {type: boolean}
      market_has_procurement_implications: {type: boolean}
      market_template_market_situation_filled: {type: boolean}
      market_template_cost_structure_filled: {type: boolean}
      unsourced_cost_percentages_absent: {type: boolean}
      docx_expanded_instead_of_truncated: {type: boolean}
      template_placeholders_removed: {type: boolean}
      notes:
        type: array
        items: {type: string}

  report_content_metrics:
    type: object
    additionalProperties: false
    required:
      - historical_spend_data_available
      - spend_numeric_fact_count
      - spend_numeric_table_count
      - spend_key_finding_count
      - spend_action_count
      - market_internal_signal_count
      - market_cost_component_count
      - market_price_or_risk_finding_count
      - market_local_fulfillment_finding_count
      - market_action_count
      - web_research_available
      - public_source_count
    properties:
      historical_spend_data_available: {type: boolean}
      spend_numeric_fact_count: {type: integer, minimum: 0}
      spend_numeric_table_count: {type: integer, minimum: 0}
      spend_key_finding_count: {type: integer, minimum: 0}
      spend_action_count: {type: integer, minimum: 0}
      market_internal_signal_count: {type: integer, minimum: 0}
      market_cost_component_count: {type: integer, minimum: 0}
      market_price_or_risk_finding_count: {type: integer, minimum: 0}
      market_local_fulfillment_finding_count: {type: integer, minimum: 0}
      market_action_count: {type: integer, minimum: 0}
      web_research_available: {type: boolean}
      public_source_count: {type: integer, minimum: 0}

  missing_items:
    type: array
    items: {type: string}

  human_decisions_required:
    type: array
    items: {type: string}

allOf:
  - if:
      properties:
        report_status: {const: ready_for_approval}
    then:
      properties:
        content_depth_checks:
          properties:
            spend_has_numeric_structure: {const: true}
            spend_available_dimensions_analyzed: {const: true}
            spend_has_procurement_implications: {const: true}
            spend_template_overall_filled: {const: true}
            spend_template_business_unit_handled: {const: true}
            spend_template_sku_filled: {const: true}
            spend_template_free_shipping_handled: {const: true}
            market_has_internal_supply_signals: {const: true}
            market_has_cost_drivers: {const: true}
            market_has_price_or_risk_view: {const: true}
            market_has_local_fulfillment_view: {const: true}
            market_has_procurement_implications: {const: true}
            market_template_market_situation_filled: {const: true}
            market_template_cost_structure_filled: {const: true}
            unsourced_cost_percentages_absent: {const: true}
            docx_expanded_instead_of_truncated: {const: true}
            template_placeholders_removed: {const: true}
        report_content_metrics:
          properties:
            spend_numeric_fact_count: {minimum: 4}
            spend_key_finding_count: {minimum: 3}
            spend_action_count: {minimum: 3}
            market_internal_signal_count: {minimum: 3}
            market_cost_component_count: {minimum: 4}
            market_price_or_risk_finding_count: {minimum: 2}
            market_local_fulfillment_finding_count: {minimum: 2}
            market_action_count: {minimum: 3}
  - if:
      properties:
        report_status: {const: ready_for_approval}
        report_content_metrics:
          properties:
            historical_spend_data_available: {const: true}
          required: [historical_spend_data_available]
      required: [report_status, report_content_metrics]
    then:
      properties:
        report_content_metrics:
          properties:
            spend_numeric_table_count: {minimum: 2}
  - if:
      properties:
        report_status: {const: ready_for_approval}
        report_content_metrics:
          properties:
            web_research_available: {const: true}
          required: [web_research_available]
      required: [report_status, report_content_metrics]
    then:
      properties:
        report_content_metrics:
          properties:
            public_source_count: {minimum: 3}
        content_depth_checks:
          properties:
            market_public_research_performed_when_web_available: {const: true}

$defs:
  evidence_value:
    type: object
    additionalProperties: false
    properties:
      state:
        type: string
        enum: [FACT, CALCULATED, PUBLIC_MARKET_INTELLIGENCE, HUMAN_DECISION, MISSING]
      source: {type: [string, "null"]}
      evidence: {type: [string, "null"]}
      confidence:
        type: string
        enum: [high, medium, low, unknown]

  public_source:
    type: object
    additionalProperties: false
    required: [source, source_date, evidence_summary, confidence]
    properties:
      source: {type: string}
      source_date: {type: string}
      evidence_summary: {type: string}
      confidence:
        type: string
        enum: [high, medium, low]

  dimension_status:
    type: object
    additionalProperties: false
    required: [available, analyzed]
    properties:
      available: {type: boolean}
      analyzed: {type: boolean}
      source_field: {type: [string, "null"]}
      limitation: {type: [string, "null"]}

  spend_dimension_item:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string}
      order_count: {type: [integer, "null"], minimum: 0}
      spend_amount: {type: [number, "null"], minimum: 0}
      spend_share: {type: [number, "null"], minimum: 0, maximum: 1}
      quantity: {type: [number, "null"], minimum: 0}
      note: {type: [string, "null"]}

  order_amount_bucket:
    type: object
    additionalProperties: false
    required: [bucket_label, order_count, order_share]
    properties:
      bucket_label: {type: string}
      order_count: {type: integer, minimum: 0}
      order_share: {type: number, minimum: 0, maximum: 1}
      spend_amount: {type: [number, "null"], minimum: 0}
      spend_share: {type: [number, "null"], minimum: 0, maximum: 1}
      note: {type: [string, "null"]}

  sku_spend_item:
    type: object
    additionalProperties: false
    required: [sku_name]
    properties:
      list_no: {type: [string, integer, "null"]}
      sku_name: {type: string}
      brand: {type: [string, "null"]}
      specification: {type: [string, "null"]}
      unit: {type: [string, "null"]}
      quantity: {type: [number, "null"], minimum: 0}
      average_unit_price: {type: [number, "null"], minimum: 0}
      spend_amount: {type: [number, "null"], minimum: 0}
      spend_share: {type: [number, "null"], minimum: 0, maximum: 1}
      tax_basis:
        type: [string, "null"]
        enum: [tax_included, pre_tax, mixed, unknown, null]
      note: {type: [string, "null"]}

  cost_component:
    type: object
    additionalProperties: false
    required: [component, impact]
    properties:
      component: {type: string}
      impact: {type: string}
      percentage_or_range: {type: [string, "null"]}
      percentage_supported: {type: boolean}
      evidence: {type: [string, "null"]}
