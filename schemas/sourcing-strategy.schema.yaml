$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/sourcing-strategy.schema.yaml"
title: "物业物资采购方案报告数据"
type: object
additionalProperties: false
required:
  - schema_version
  - report_status
  - project
  - demand_background
  - scope_and_lots
  - spend_analysis
  - market_analysis
  - shortlist
  - commercial_terms
  - supplier_selection
  - target_price
  - award_rule
  - share_allocation
  - risks
  - evaluation_team
  - consistency_checks
properties:
  schema_version:
    type: string
    const: "0.7.0"

  report_status:
    type: string
    enum: [draft, ready_for_approval]

  project:
    type: object
    additionalProperties: false
    required: [project_name, procurement_method]
    properties:
      project_name:
        type: string
      procurement_method:
        type: string
        enum: [invitation_tender, competitive_negotiation, single_source, other]
      demand_time:
        type: [string, "null"]
      procurement_period:
        type: [string, "null"]
      budget_amount:
        type: [number, "null"]
        minimum: 0
      budget_tax_basis:
        type: [string, "null"]
        enum: [tax_included, pre_tax, mixed, unknown, null]
      budget_source:
        $ref: "#/$defs/evidence_value"

  demand_background:
    type: object
    additionalProperties: false
    properties:
      summary:
        type: [string, "null"]
      usage_scenarios:
        type: array
        items:
          type: string
      delivery_regions:
        type: array
        items:
          type: string
      original_contract_expiry:
        type: [string, "null"]
      historical_findings:
        type: array
        items:
          type: string
      demand_growth_basis:
        type: [string, "null"]

  scope_and_lots:
    type: object
    additionalProperties: false
    properties:
      sku_count:
        type: [integer, "null"]
        minimum: 0
      estimated_total_quantity:
        type: [number, "null"]
        minimum: 0
      lot_count:
        type: [integer, "null"]
        minimum: 1
      lot_description:
        type: array
        items:
          type: string
      quantity_source:
        $ref: "#/$defs/evidence_value"

  spend_analysis:
    type: object
    additionalProperties: false
    properties:
      historical_period:
        type: [string, "null"]
      historical_tax_included_spend:
        type: [number, "null"]
        minimum: 0
      historical_pre_tax_spend:
        type: [number, "null"]
        minimum: 0
      projected_spend:
        type: [number, "null"]
        minimum: 0
      yoy_change_rate:
        type: [number, "null"]
      region_findings:
        type: array
        items:
          type: string
      sku_findings:
        type: array
        items:
          type: string
      price_findings:
        type: array
        items:
          type: string
      data_limitations:
        type: array
        items:
          type: string

  market_analysis:
    type: object
    additionalProperties: false
    properties:
      market_characteristics:
        type: array
        items:
          type: string
      cost_drivers:
        type: array
        items:
          type: string
      price_trends:
        type: array
        items:
          type: string
      regulatory_factors:
        type: array
        items:
          type: string
      sourcing_implications:
        type: array
        items:
          type: string
      sources:
        type: array
        items:
          $ref: "#/$defs/public_source"

  shortlist:
    type: object
    additionalProperties: false
    properties:
      official_registry_candidates:
        type: [integer, "null"]
        minimum: 0
      contacted_suppliers:
        type: [integer, "null"]
        minimum: 0
      replied_suppliers:
        type: [integer, "null"]
        minimum: 0
      shortlisted_count:
        type: [integer, "null"]
        minimum: 0
      shortlisted_suppliers:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [supplier_name, reasons]
          properties:
            supplier_name:
              type: string
            reasons:
              type: array
              items:
                type: string
            attention_items:
              type: array
              items:
                type: string
      evidence:
        $ref: "#/$defs/evidence_value"

  commercial_terms:
    type: object
    additionalProperties: false
    properties:
      delivery_lead_time:
        type: [string, "null"]
      warranty:
        type: [string, "null"]
      payment_terms:
        type: [string, "null"]
      contract_period:
        type: [string, "null"]
      tax_terms:
        type: [string, "null"]
      bid_bond:
        type: [string, "null"]
      performance_bond:
        type: [string, "null"]

  supplier_selection:
    type: object
    additionalProperties: false
    properties:
      method:
        type: [string, "null"]
      technical_bid_required:
        type: [boolean, "null"]
      commercial_weight:
        type: [number, "null"]
        minimum: 0
        maximum: 1
      description:
        type: [string, "null"]
      human_confirmed:
        type: boolean

  target_price:
    type: object
    additionalProperties: false
    properties:
      basis:
        type: array
        items:
          type: string
      basic_target:
        type: [string, "null"]
      challenge_target:
        type: [string, "null"]
      human_confirmed:
        type: boolean

  award_rule:
    type: object
    additionalProperties: false
    properties:
      award_supplier_count:
        type: [integer, "null"]
        minimum: 1
      backup_supplier_count:
        type: [integer, "null"]
        minimum: 0
      ranking_basis:
        type: [string, "null"]
      tie_rule:
        type: [string, "null"]
      backup_activation_rule:
        type: [string, "null"]
      human_confirmed:
        type: boolean

  share_allocation:
    type: object
    additionalProperties: false
    properties:
      applicable:
        type: boolean
      description:
        type: [string, "null"]
      human_confirmed:
        type: boolean

  risks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [risk, evidence, impact, mitigation]
      properties:
        risk:
          type: string
        evidence:
          type: string
        impact:
          type: string
        mitigation:
          type: string
        human_confirmation_required:
          type: boolean

  evaluation_team:
    type: object
    additionalProperties: false
    properties:
      members:
        type: array
        items:
          type: string
      status:
        type: string
        enum: [confirmed, pending]
      source:
        $ref: "#/$defs/evidence_value"

  consistency_checks:
    type: object
    additionalProperties: false
    required:
      - quantity_consistent
      - budget_consistent
      - region_consistent
      - shortlist_consistent
      - commercial_terms_consistent
      - award_rule_consistent
    properties:
      quantity_consistent:
        type: boolean
      budget_consistent:
        type: boolean
      region_consistent:
        type: boolean
      shortlist_consistent:
        type: boolean
      commercial_terms_consistent:
        type: boolean
      award_rule_consistent:
        type: boolean
      blockers:
        type: array
        items:
          type: string

  missing_items:
    type: array
    items:
      type: string

  human_decisions_required:
    type: array
    items:
      type: string

$defs:
  evidence_value:
    type: object
    additionalProperties: false
    properties:
      state:
        type: string
        enum: [FACT, CALCULATED, PUBLIC_MARKET_INTELLIGENCE, HUMAN_DECISION, MISSING]
      source:
        type: [string, "null"]
      evidence:
        type: [string, "null"]
      confidence:
        type: string
        enum: [high, medium, low, unknown]

  public_source:
    type: object
    additionalProperties: false
    required: [source, source_date, evidence_summary]
    properties:
      source:
        type: string
      source_date:
        type: string
      evidence_summary:
        type: string
      confidence:
        type: string
        enum: [high, medium, low]
