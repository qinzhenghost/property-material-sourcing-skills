$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/schemas/supplier-shortlist.schema.yaml"
title: "物业物资供方短名单与报批结果"
description: >-
  supplier-shortlist v0.5.0 的统一结构化结果。Phase A 汇总供方回复并形成短名单草稿；
  采购员人工确认后，Phase B 固化最终短名单、生成报批邮件草稿和 sourcing-strategy Handoff。
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - source_scope
  - shortlist
  - human_shortlist_checkpoint
  - artifacts
properties:
  schema_version:
    type: string
    const: "0.5.0"

  project:
    type: object
    additionalProperties: false
    required: [project_name, sourcing_method]
    properties:
      project_name: {type: string}
      category: {type: [string, "null"]}
      sourcing_method: {type: string, const: invitation_tender}

  source_scope:
    type: object
    additionalProperties: false
    required: [identity_source, initial_supplier_count]
    properties:
      identity_source:
        type: string
        const: sourcing_invitation_confirmed_initial_supplier_pool
      initial_supplier_count: {type: integer, minimum: 0}
      contacted_count: {type: [integer, "null"], minimum: 0}
      replied_count: {type: [integer, "null"], minimum: 0}
      reply_sources:
        type: array
        items: {type: string}
      limitations:
        type: array
        items: {type: string}

  shortlist:
    type: object
    additionalProperties: false
    required: [status, supplier_decisions]
    properties:
      status:
        type: string
        enum:
          - draft_pending_human_confirmation
          - human_confirmed
      supplier_decisions:
        type: array
        items:
          $ref: "#/$defs/supplier_decision"
      suggested_shortlisted_count: {type: [integer, "null"], minimum: 0}
      final_shortlisted_count: {type: [integer, "null"], minimum: 0}
      excluded_count: {type: [integer, "null"], minimum: 0}
      pending_count: {type: [integer, "null"], minimum: 0}

  human_shortlist_checkpoint:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        type: string
        enum: [pending, confirmed]
      confirmed_shortlisted_supplier_ids:
        type: array
        items: {type: string}
      confirmed_excluded_supplier_ids:
        type: array
        items: {type: string}
      confirmed_pending_supplier_ids:
        type: array
        items: {type: string}
      reviewer_note: {type: [string, "null"]}

  approval_summary:
    type: object
    additionalProperties: false
    properties:
      longlist_count: {type: [integer, "null"], minimum: 0}
      contacted_count: {type: [integer, "null"], minimum: 0}
      replied_count: {type: [integer, "null"], minimum: 0}
      shortlisted_count: {type: [integer, "null"], minimum: 0}
      excluded_count: {type: [integer, "null"], minimum: 0}
      pending_count: {type: [integer, "null"], minimum: 0}

  artifacts:
    type: object
    additionalProperties: false
    required: [shortlist_workbook, approval_email, strategy_handoff]
    properties:
      shortlist_workbook:
        type: object
        additionalProperties: false
        required: [format, filename, template, status]
        properties:
          format: {type: string, const: xlsx}
          filename: {type: string}
          template: {type: string}
          status:
            type: string
            enum: [draft_pending_human_confirmation, human_confirmed, blocked]
      approval_email:
        type: object
        additionalProperties: false
        required: [format, status]
        properties:
          format: {type: string, const: markdown}
          filename: {type: [string, "null"]}
          template: {type: [string, "null"]}
          subject: {type: [string, "null"]}
          body: {type: [string, "null"]}
          attachments:
            type: array
            items: {type: string}
          status:
            type: string
            enum:
              - not_generated_pending_shortlist_confirmation
              - draft_pending_shortlist_confirmation
              - ready_for_human_review
              - blocked
      strategy_handoff:
        type: object
        additionalProperties: false
        required: [status]
        properties:
          format: {type: string, const: yaml}
          filename: {type: [string, "null"]}
          status:
            type: string
            enum: [not_ready, generated, blocked]

  strategy_handoff:
    type: object
    additionalProperties: false
    properties:
      workflow_stage:
        type: string
        const: shortlist_confirmed
      shortlist:
        type: object
        additionalProperties: false
        properties:
          longlist_count: {type: [integer, "null"], minimum: 0}
          contacted_count: {type: [integer, "null"], minimum: 0}
          replied_count: {type: [integer, "null"], minimum: 0}
          shortlisted_count: {type: [integer, "null"], minimum: 0}
          excluded_count: {type: [integer, "null"], minimum: 0}
          pending_count: {type: [integer, "null"], minimum: 0}
          shortlisted_suppliers:
            type: array
            items: {$ref: "#/$defs/final_supplier_decision"}
          excluded_suppliers:
            type: array
            items: {$ref: "#/$defs/final_supplier_decision"}
          pending_suppliers:
            type: array
            items: {$ref: "#/$defs/final_supplier_decision"}
      selection_rationale:
        type: array
        items: {type: string}
      supplier_market_observations:
        type: array
        items: {type: string}
      risk_flags:
        type: array
        items: {type: string}
      human_confirmation:
        type: object
        additionalProperties: false
        required: [shortlist_confirmed]
        properties:
          shortlist_confirmed: {type: boolean, const: true}
          approval_email_reviewed: {type: [boolean, "null"]}
      next_skill:
        type: string
        const: sourcing-strategy

  consistency_check:
    type: object
    additionalProperties: false
    properties:
      passed: {type: boolean}
      all_initial_suppliers_accounted_for: {type: boolean}
      decisions_traceable_to_evidence: {type: boolean}
      ai_recommendation_separated_from_human_decision: {type: boolean}
      approval_email_matches_confirmed_shortlist: {type: boolean}
      strategy_handoff_matches_confirmed_shortlist: {type: boolean}
      issues:
        type: array
        items: {type: string}

$defs:
  supplier_decision:
    type: object
    additionalProperties: false
    required:
      - supplier_name
      - ai_recommendation
      - evidence
      - human_decision
    properties:
      supplier_id: {type: [string, "null"]}
      supplier_name: {type: string}
      replied: {type: [boolean, "null"]}
      cooperation_intent: {type: [string, "null"]}
      ai_recommendation:
        type: string
        enum: [suggested_shortlist, pending_clarification, not_recommended]
      recommendation_reasons:
        type: array
        items: {type: string}
      evidence:
        type: array
        items: {type: string}
      attention_items:
        type: array
        items: {type: string}
      human_decision:
        type: string
        enum: [pending, shortlisted, excluded, pending_clarification]

  final_supplier_decision:
    type: object
    additionalProperties: false
    required: [supplier_name, status, reasons]
    properties:
      supplier_id: {type: [string, "null"]}
      supplier_name: {type: string}
      status:
        type: string
        enum: [shortlisted, excluded, pending_clarification]
      reasons:
        type: array
        items: {type: string}
      attention_items:
        type: array
        items: {type: string}
      evidence_source:
        type: array
        items: {type: string}
